<svg xmlns="http://www.w3.org/2000/svg" width="528" height="950" viewBox="0 0 528 950"><g font-family="Yu Gothic,Meiryo,Microsoft YaHei,sans-serif" font-weight="bold"><rect x="29" y="23" width="470" height="66" rx="20" fill="#482f22" fill-opacity=".95" stroke="#d6a750" stroke-width="5"/><text x="264" y="68" font-size="31" fill="#fff4d2" text-anchor="middle">カンガルーのそうげん</text><rect x="20" y="638" width="488" height="119" rx="20" fill="#482f22" fill-opacity=".95" stroke="#d6a750" stroke-width="5"/><svg x="30" y="650" width="75" height="85" viewBox="0 0 560 680"><image href="../人物三视图/C03_拳击袋鼠.png" width="1672" height="940"/></svg><text x="119" y="670" font-size="19" fill="#fff4d2" text-anchor="start">カンガルー</text><text x="122" y="704" font-size="16" fill="#fff4d2" text-anchor="start">このリングから、にげられると思うなよ、</text><text x="122" y="732" font-size="16" fill="#fff4d2" text-anchor="start">ボクのパンチは、だれにもとめられない。</text><rect x="20" y="783" width="488" height="128" rx="20" fill="#482f22" fill-opacity=".95" stroke="#d6a750" stroke-width="5"/><svg x="30" y="800" width="75" height="85" viewBox="0 0 560 680"><image href="../人物三视图/C01_森林探险家_波利.png" width="1672" height="940"/></svg><text x="119" y="810" font-size="19" fill="#fff4d2" text-anchor="start">森のたんけんか</text><text x="122" y="845" font-size="18" fill="#fff4d2" text-anchor="start">う、うわぁ、すごいパンチだ…、</text><text x="122" y="880" font-size="16" fill="#fff4d2" text-anchor="start">で、でも、まけないぞ。コンパスにかけて、</text></g></svg>